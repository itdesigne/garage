<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>បញ្ជីគ្រឿងបន្លាស់</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" type="image/png"
        href="https://cdn-icons-png.flaticon.com/512/10951/10951869.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .list-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 0;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 0.95rem;
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }
    .add-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 5px;
    }
    /* Counter Badge */
    .count-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .count-badge span {
      color: #60a5fa;
      font-size: 1.1rem;
    }

    /* Grid Layout */
    .garage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }

    /* Card Styling */
    .card-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
    .card-image-box {
      width: 100%;
      height: 190px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card-image-box:hover img {
      transform: scale(1.04);
    }
    .card-no-img {
      color: #475569;
      font-size: 2.5rem;
    }
    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 0.85rem;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #1e293b;
    }
    .price-col {
      display: flex;
      flex-direction: column;
    }
    .price-label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .price-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .price-total {
      color: #4ade80;
    }
    .card-notes {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 15px;
      flex: 1;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }
    .card-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .card-btn:hover {
      opacity: 0.85;
    }
    .btn-edit-card {
      background: #3b82f6;
      color: white;
    }
    .btn-delete-card {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }

    /* Modal Form Styles */
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-card-custom {
      max-width: 520px;
      width: 90%;
    }

    @media (max-width: 410px){
      .dash-header {
        flex-direction: column;
        align-items: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="dash-header">
      <div>
        <h2>តារាងគ្រឿងបន្លាស់ (Garage Items)</h2>
      </div>
      <div class="add-group">
        <a href="additems.html" class="btn btn-primary" id="addNewBtn" style="margin-right: 8px;">+ Add New</a>
        <a href="dashboard.html" class="btn btn-outline">← Back</a>
      </div>
    </header>

    <div class="list-wrapper">
      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="ស្វែងរកតាម Garage, Car Type, ឬ Item..." oninput="handleSearch()" />
        </div>
        <div class="count-badge">
          <i class="fas fa-boxes"></i> ចំនួនសរុប: <span id="itemsCount">0</span>
        </div>
      </div>

      <div class="garage-grid" id="itemsGrid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #94a3b8;">
          <i class="fas fa-spinner fa-spin fa-2x"></i>
          <p style="margin-top: 10px;">កំពុងទាញយកទិន្នន័យ...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal" id="editModal">
    <div class="modal-content modal-card-custom">
      <span class="close" onclick="closeEditModal()">&times;</span>
      <h3 style="margin-bottom: 10px; text-align: left;">កែប្រែទិន្នន័យ (Edit Item)</h3>

      <form id="editForm" style="text-align: left;">
        <input type="hidden" id="editRowIndex" />
        <input type="hidden" id="editExistingPhoto" />

        <div class="modal-grid">
          <div class="form-group">
            <label for="editGarage">Garage</label>
            <input type="text" id="editGarage" required />
          </div>
          <div class="form-group">
            <label for="editCarType">Car Type</label>
            <input type="text" id="editCarType" required />
          </div>
        </div>

        <div class="form-group">
          <label for="editItemService">Item / Service</label>
          <input type="text" id="editItemService" required />
        </div>

        <div class="modal-grid">
          <div class="form-group">
            <label for="editPrice">Price ($)</label>
            <input type="number" step="any" id="editPrice" required />
          </div>
          <div class="form-group">
            <label for="editRiel">Riel ($)</label>
            <input type="number" step="any" id="editRiel" required />
          </div>
        </div>

        <div class="form-group">
          <label for="editPhoto">Change Photo (Optional)</label>
          <input type="file" id="editPhoto" accept="image/*" />
        </div>

        <div class="form-group">
          <label for="editNotes">Notes</label>
          <input type="text" id="editNotes" />
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" id="editSaveBtn">Save Changes</button>
          <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

<script src="secur.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzigdtzhwHK7GonVPpgiRDLfdOY5DP-ERjAqMw4l5SsZqurGI5IMiMRdReMmwTHjeWP/exec";
    const username = (localStorage.getItem("username") || "").trim().toLowerCase();
    const userRole = (localStorage.getItem("userRole") || "pending").trim().toLowerCase();
    const isAdmin = userRole === "admin";
    let allItems = [];

    // Hide the top "+ Add New" button if the user is not an admin
    function checkAddButtonAccess() {
      const addBtn = document.querySelector('a[href="additems.html"]');
      if (addBtn && !isAdmin) {
        addBtn.style.display = "none";
      }
    }

    // Helper: Converts standard Google Drive links to direct preview thumbnail URLs
    function formatDriveThumbnail(url) {
      if (!url || typeof url !== "string") return "";
      
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        return `https://drive.google.com/thumbnail?id=${fileIdMatch[1]}&sz=w1200`;
      }
      return url;
    }

    async function fetchGarageItems() {
      try {
        const url = `${SCRIPT_URL}?action=getGarageItems&username=${encodeURIComponent(username)}&_=${Date.now()}`;
        const res = await fetch(url);
        const result = await res.json();

        if (result.status === "success") {
          allItems = result.data;
          renderGrid(allItems);
        } else {
          document.getElementById("itemsGrid").innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; color: #f87171; padding: 30px;">
              ${result.message}
            </div>`;
        }
      } catch (err) {
        document.getElementById("itemsGrid").innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #f87171; padding: 30px;">
            Failed to load data: ${err.message}
          </div>`;
      }
    }

    function renderGrid(items) {
      const container = document.getElementById("itemsGrid");
      const countEl = document.getElementById("itemsCount");

      if (countEl) {
        countEl.textContent = items ? items.length : 0;
      }

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 40px;">
            ពុំមានទិន្នន័យឡើយ (No records found)
          </div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const price = Number(item.price) || 0;
        const Riel = Number(item.Riel) || 0;

        let imgHtml = `<div class="card-no-img"><i class="fas fa-tools"></i></div>`;
        if (item.photo && item.photo.startsWith("http")) {
          imgHtml = `
            <a href="${item.photo}" target="_blank" rel="noopener noreferrer" style="width:100%;height:100%;display:block;">
              <img 
                src="${item.photo}" 
                alt="${escapeHtml(item.itemService)}" 
                referrerpolicy="no-referrer" 
                loading="lazy" 
              />
            </a>`;
        }

        // Show Edit and Delete buttons ONLY to Admin accounts
        const actionsHtml = isAdmin ? `
          <div class="card-actions">
            <button class="card-btn btn-edit-card" onclick="openEditModal(${item.rowIndex})">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button class="card-btn btn-delete-card" onclick="deleteItem(${item.rowIndex})">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        ` : '';

        return `
          <div class="card-item">
            <div class="card-image-box">
              <span class="card-badge">${escapeHtml(item.garage)}</span>
              ${imgHtml}
            </div>

            <div class="card-body">
              <div class="card-title">${escapeHtml(item.itemService)}</div>
              <div class="card-subtitle"><i class="fas fa-car"></i> ${escapeHtml(item.carType)}</div>

              <div class="price-row">
                <div class="price-col">
                  <span class="price-label">Price</span>
                  <span class="price-val">$${price.toFixed(2)}</span>
                </div>
                <div class="price-col">
                  <span class="price-label">Riel</span>
                  <span class="price-val">៛${Number(Riel).toLocaleString('fr-FR')}</span> 
                </div>

              </div>

              <div class="card-notes">${escapeHtml(item.notes) || "<em>No notes provided.</em>"}</div>

              ${actionsHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    function handleSearch() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allItems.filter(item => 
        String(item.garage).toLowerCase().includes(q) ||
        String(item.carType).toLowerCase().includes(q) ||
        String(item.itemService).toLowerCase().includes(q) ||
        String(item.notes).toLowerCase().includes(q)
      );
      renderGrid(filtered);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ----------------------------------------------------
    // EDIT MODAL ACTIONS (ADMIN ONLY)
    // ----------------------------------------------------
    function openEditModal(rowIndex) {
      if (!isAdmin) return;
      const item = allItems.find(x => x.rowIndex === rowIndex);
      if (!item) return;

      document.getElementById("editRowIndex").value = item.rowIndex;
      document.getElementById("editExistingPhoto").value = item.photo || "";
      document.getElementById("editGarage").value = item.garage || "";
      document.getElementById("editCarType").value = item.carType || "";
      document.getElementById("editItemService").value = item.itemService || "";
      document.getElementById("editPrice").value = item.price || 0;
      document.getElementById("editRiel").value = item.Riel || 0;
      document.getElementById("editNotes").value = item.notes || "";
      document.getElementById("editPhoto").value = "";

      document.getElementById("editModal").classList.add("show");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("show");
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!isAdmin) return;

      const btn = document.getElementById("editSaveBtn");
      btn.disabled = true;
      btn.textContent = "Updating...";

      try {
        const fileInput = document.getElementById("editPhoto");
        let photoData = "";
        let photoName = "";
        let photoType = "";

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          photoName = file.name;
          photoType = file.type;
          photoData = await new Promise(res => {
            const r = new FileReader();
            r.onload = ev => res(ev.target.result.split(",")[1]);
            r.readAsDataURL(file);
          });
        }

        const payload = {
          action: "updateGarageItem",
          username: username,
          rowIndex: document.getElementById("editRowIndex").value,
          existingPhoto: document.getElementById("editExistingPhoto").value,
          garage: document.getElementById("editGarage").value.trim(),
          carType: document.getElementById("editCarType").value.trim(),
          itemService: document.getElementById("editItemService").value.trim(),
          price: document.getElementById("editPrice").value,
          Riel: document.getElementById("editRiel").value,
          notes: document.getElementById("editNotes").value.trim(),
          photoData: photoData,
          photoName: photoName,
          photoType: photoType
        };

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const out = await res.json();

        if (out.status === "success") {
          closeEditModal();
          fetchGarageItems();
        } else {
          alert("Error: " + out.message);
        }
      } catch (err) {
        alert("Update failed: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Changes";
      }
    });

    // ----------------------------------------------------
    // DELETE ACTION (ADMIN ONLY)
    // ----------------------------------------------------
    async function deleteItem(rowIndex) {
      if (!isAdmin) {
        alert("Admin permission required to delete items.");
        return;
      }

      if (!confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យនេះមែនទេ? (Are you sure you want to delete this?)")) {
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ 
            action: "deleteGarageItem", 
            username: username,
            rowIndex: rowIndex 
          })
        });
        const out = await res.json();

        if (out.status === "success") {
          fetchGarageItems();
        } else {
          alert("Error: " + out.message);
        }
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      checkAddButtonAccess();
      fetchGarageItems();
    });
  </script>
</body>
</html>
