<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>គ្រឿងបន្លាស់រថយន្ត</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#23297A">
    <link rel="shortcut icon" type="image/png"
        href="https://cdn-icons-png.flaticon.com/512/18183/18183402.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Light mode variables */
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --secondary: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;

            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;

            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --bg-card: #ffffff;

            --border-primary: #e5e7eb;
            --border-secondary: #e5e7eb;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --text-tertiary: #9ca3af;

            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-card: #1e293b;

            --border-primary: #334155;
            --border-secondary: #475569;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: khmer os battambang, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            overflow-x: hidden;
        }

        /* Background animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 50px;
            padding: 0.5rem;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .theme-toggle i {
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .theme-toggle:hover i {
            color: var(--primary);
        }

        /* Auth container */
        .auth-container {
            background: var(--bg-card);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .auth-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .auth-header p {
            opacity: 0.95;
            font-size: 0.95rem;
            position: relative;
            z-index: 1;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-primary);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .tab-btn::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary);
            background: var(--bg-card);
        }

        .tab-btn.active::before {
            transform: scaleX(1);
        }

        .tab-btn:hover {
            color: var(--primary);
            background: var(--bg-tertiary);
        }

        /* Form body */
        .auth-body {
            padding: 2rem;
            background: var(--bg-card);
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.5rem;
            border: 2px solid var(--border-primary);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus+.input-icon {
            color: var(--primary);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .submit-btn:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Message */
        #message {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            min-height: 1.5em;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 8px;
            transition: var(--transition);
        }

        .error {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success {
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .hidden {
            display: none;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive design */
        @media (max-width: 640px) {
            .auth-container {
                margin: 1rem;
                max-width: none;
            }

            .auth-header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .auth-header h1 {
                font-size: 1.75rem;
            }

            .auth-body {
                padding: 1.5rem;
            }

            .tab-btn {
                padding: 0.875rem;
                font-size: 0.875rem;
            }

            input[type="text"],
            input[type="password"] {
                padding: 0.75rem 1rem 0.75rem 2.25rem;
                font-size: 0.95rem;
            }

            .input-icon {
                font-size: 0.875rem;
                left: 0.875rem;
            }
        }

        /* Extra small devices */
        @media (max-width: 480px) {
            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .auth-header p {
                font-size: 0.875rem;
            }

            .submit-btn {
                padding: 0.875rem;
                font-size: 0.875rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --border-primary: #000000;
                --border-secondary: #000000;
            }

            [data-theme="dark"] {
                --border-primary: #ffffff;
                --border-secondary: #ffffff;
            }
        }
    </style>

</head>

<body data-theme="light">
    <div class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </div>

    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1 id="headerTitle">គ្រឿងបន្លាស់រថយន្ត</h1>
                <p id="headerSubtitle">ស្នើរសុំសិទ្ធចូលប្រើប្រព័ន្ធជាមុន</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">
                    <i class="fas fa-sign-in-alt" style="margin-right: 0.5rem;"></i> ចូលប្រើ
                </button>
                <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">
                    <i class="fas fa-user-plus" style="margin-right: 0.5rem;"></i> ចុះឈ្មោះ
                </button>
            </div>

            <div class="auth-body">
                <!-- LOGIN FORM -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">ឈ្មោះចូលប្រើ</label>
                        <div class="input-wrapper">
                            <input type="text" id="loginUsername" placeholder="Enter username" required
                                autocomplete="username">
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">ពាក្យសំងាត់</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter password" required
                                autocomplete="current-password">
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">
                        <span id="loginBtnText">ចូលប្រើ</span>
                    </button>
                </form>

                <!-- SIGN UP FORM -->
                <form id="signupForm" class="hidden">
                    <div class="form-group">
                        <label for="signupName">ឈ្មោះពេញ</label>
                        <div class="input-wrapper">
                            <input type="text" id="signupName" placeholder="Enter full name" required>
                            <i class="fas fa-id-card input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupUsername">ឈ្មោះចូលប្រើ</label>
                        <div class="input-wrapper">
                            <input type="text" id="signupUsername" placeholder="Choose a username" required>
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">ពាក្យសំងាត់</label>
                        <div class="input-wrapper">
                            <input type="password" id="signupPassword" placeholder="Create a password" required>
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="signupBtn">
                        <span id="signupBtnText">ចុះឈ្មោះ</span>
                    </button>
                </form>

                <div id="message" role="alert"></div>
            </div>
        </div>
    </div>
