<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>គ្រប់គ្រងអ្នកប្រើប្រាស់</title>
  <link rel="stylesheet" href="style.css" /><link rel="shortcut icon" type="image/png"
        href="https://cdn-icons-png.flaticon.com/512/15181/15181334.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .list-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px 0;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 0.95rem;
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .table-container {
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid #334155;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
      vertical-align: middle;
    }
    th {
      background: #162032;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
    }
    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .role-badge-table {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .role-admin {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #3b82f6;
    }
    .role-user {
      background: rgba(148, 163, 184, 0.1);
      color: #94a3b8;
      border: 1px solid #475569;
    }
    select.role-select {
      background: #0f172a;
      color: white;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-delete-user {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    .btn-delete-user:hover {
      opacity: 0.8;
    }
    .btn-delete-user:disabled, select.role-select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="dash-header">
      <div>
        <h2>គ្រប់គ្រងអ្នកប្រើប្រាស់ (User Management)</h2>
      </div>
      <a href="dashboard.html" class="btn btn-outline">← Back</a>
    </header>

    <div class="list-wrapper">
      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="ស្វែងរកតាម ឈ្មោះ ឬ ឈ្មោះចូលប្រើ..." oninput="handleSearch()" />
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>ឈ្មោះពេញ</th>
              <th>ឈ្មោះចូលប្រើ</th>
              <th>Role បច្ចុប្បន្ន</th>
              <th>កែប្រែ Role</th>
              <th>កាលបរិច្ឆេទបង្កើត</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr>
              <td colspan="7" style="text-align: center; padding: 30px; color: #94a3b8;">
                <i class="fas fa-spinner fa-spin"></i> កំពុងទាញយកទិន្នន័យ...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
